<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy - All Users</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f7f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #28a745;
            color: white;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>FitBuddy - All Users</h1>

        <table>

            <tr>
                <th>Name</th>
                <th>User ID</th>
                <th>Age</th>
                <th>Weight</th>
                <th>Fitness Goal</th>
                <th>Intensity</th>
            </tr>

            {% for user in users %}

            <tr>
                <td>{{ user.name }}</td>
                <td>{{ user.user_id }}</td>
                <td>{{ user.age }}</td>
                <td>{{ user.weight }}</td>
                <td>{{ user.fitness_goal }}</td>
                <td>{{ user.intensity }}</td>
            </tr>

            {% endfor %}

        </table>

    </div>

    <a class="home-link" href="/">
        ← Back to Home
    </a>

</div>

</body>
</html>
